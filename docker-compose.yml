services:
  db:
    # 本番（Neon）・CI と同じ PostgreSQL 18
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow
      POSTGRES_DB: projectflow
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 以降の公式イメージは、データを /var/lib/postgresql/<メジャーバージョン>/docker に置く
      # （マウント先は /var/lib/postgresql）。17 のデータ（ボリューム pgdata）とは形式が異なり共用できないため、
      # 別のボリュームを使う。旧ボリュームは削除せずに残している（docs/deployment.md「ローカルの PostgreSQL」）
      - pgdata18:/var/lib/postgresql
      # 初回起動時にテスト用 DB（projectflow_test）を作成する
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata18:
